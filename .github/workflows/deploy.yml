name: Fahrtenbuch auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6
      - name: Abhängigkeiten installieren
        run: npm install
      - name: Anwendung testen
        run: npm test
      - name: Anwendung bauen
        run: npm run build
      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages bereitstellen
        id: deployment
        uses: actions/deploy-pages@v5
